name: "CI"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  ffi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
      with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
          override: true
    - name: Build & Test
      run: cargo build && cargo test
    - name: Clippy
      run: cargo clippy -- -D warnings -A clippy::missing_safety_doc
  golang:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
      with:
          override: true
    - name: Set up Golang toolchain
      id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.25
    - name: Install musl target
      run: rustup target add x86_64-unknown-linux-musl
    - name: Build & Test
      # src/lib.h is committed and regenerated by maintainers with cbindgen
      # (which needs nightly); treat it as up-to-date so CI builds against the
      # committed header instead of trying to regenerate it.
      run: make --old-file=src/lib.h && make --old-file=src/lib.h test
  version:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Install yq
      run: sudo apt-get update && sudo apt-get install yq
    - name: Check versions are consistent
      run: |
        [ "$(tomlq -r '.package.version' Cargo.toml)" = "$(tomlq -r '.dependencies."challenge-bypass-ristretto".version' Cargo.toml)" ] || (echo "Error: Crate version does not match challenge-bypass-ristretto version" && exit 1)
